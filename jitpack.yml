jdk:
  - openjdk17
before_install:
  - export RELEASE_VERSION=$(git describe --tags --abbrev=0 || echo "1.28.n")
  - mkdir -p app/build/outputs/aar
  - wget -O app/build/outputs/aar/aniyomi-mpv-lib-release.aar https://github.com/salmanbappi/aniyomi-mpv-lib/releases/download/$RELEASE_VERSION/aniyomi-mpv-lib-$RELEASE_VERSION.aar
install:
  - ./gradlew app:publishBarPublicationToMavenLocal
