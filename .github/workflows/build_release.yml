name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - '*'
    branches:
      - secozzi-merged
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install autoconf pkg-config libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson

      - name: Build the release artifacts
        run: |
          set -x
          unset ANDROID_SDK_ROOT
          cd buildscripts
          ./download.sh > /dev/null
          ./buildall.sh --arch x86 mpv
          ./buildall.sh --arch x86_64 mpv
          ./buildall.sh --arch arm64 mpv
          ./buildall.sh
        env:
          GRADLE_OPTS: -Xmx4G
      - name: Get tag name
        run: |
          set -x
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION_TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
          else
            echo "VERSION_TAG=v0.1.17" >> $GITHUB_ENV
          fi

      - name: Copy build artifacts
        run: |
          set -e
          mv lib/build/outputs/aar/lib-release.aar mpv-android-lib-${{ env.VERSION_TAG }}.aar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-android-lib-${{ env.VERSION_TAG }}
          path: mpv-android-lib-${{ env.VERSION_TAG }}.aar

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: mpv-android-lib ${{ env.VERSION_TAG }}
          body: |
            library version ${{ env.VERSION_TAG }}
          files: |
            mpv-android-lib-${{ env.VERSION_TAG }}.aar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release
        continue-on-error: true
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$MAVEN_CENTRAL_USERNAME" ]; then
            echo "Skipping Maven Central publication: secrets not configured"
            exit 0
          fi
          echo "$SIGNING_KEY" | base64 -d > /tmp/keyring.gpg
          ./gradlew publishAllPublicationsToMavenCentralRepository \
            -Psigning.secretKeyRingFile=/tmp/keyring.gpg \
            -Psigning.password="$SIGNING_PASSWORD" \
            -Psigning.keyId="$SIGNING_KEY_ID" \
            -PmavenCentralUsername="$MAVEN_CENTRAL_USERNAME" \
            -PmavenCentralPassword="$MAVEN_CENTRAL_PASSWORD"
          rm -f /tmp/keyring.gpg


